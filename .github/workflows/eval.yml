name: eval

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        
      - name: Install
        run: uv sync --frozen
      - name: Retrieval eval
        run: uv run python eval.py
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
